<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jabez</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <link id="app-theme" rel="stylesheet"/>
  <app-root></app-root>

  <!--
    啟動失敗的保底畫面。
    在此之前，只要 Angular bootstrap 前後丟出任何例外（舊瀏覽器語法不支援、lazy chunk 404、
    儲存被瀏覽器封鎖…），畫面就是**一片純白**，使用者看不到任何訊息也無從自救，
    客服端更無法分辨是當機還是網路慢。2026-09 有員工用 iPhone Safari 遇到此情況。
    這段刻意寫成不依賴任何框架與外部檔案的 ES5 inline script —— 它要能在
    「連 main.js 都 parse 不了」的舊瀏覽器上執行。
  -->
  <div id="boot-fallback" style="display:none;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:32rem;margin:0 auto;padding:3rem 1.5rem;color:#1f2937;line-height:1.7">
    <h1 style="font-size:1.25rem;margin:0 0 1rem">網頁載入失敗</h1>
    <p id="boot-fallback-msg" style="margin:0 0 1rem"></p>
    <p id="boot-fallback-hint" style="margin:0 0 1.5rem;font-size:.875rem;color:#6b7280">
      若重新載入後仍然如此，請確認：<br>
      1. iPhone 使用者：設定 → Safari → 隱私權與安全性 →「阻擋所有 Cookie」請關閉<br>
      2. 系統版本過舊（iOS 16.3 以下）無法支援，請更新至 iOS 16.4 以上後再試<br>
      3. 仍無法排除時，請將本畫面截圖提供給系統管理員
    </p>

    <!--
      技術資訊：**一定要印在畫面上**。
      這個保底畫面唯一的回報管道就是使用者的截圖，沒有這段就只能靠猜
      （2026-09 第一版只印「請重新載入」，收到截圖後仍無法分辨是 storage 被擋、
      chunk 404 還是語法不支援，白白多繞一輪）。內容只有 UA 與例外訊息，不含任何個資。
    -->
    <pre id="boot-fallback-diag" style="margin:0 0 1.5rem;padding:.75rem;background:#f3f4f6;border-radius:.375rem;font-size:.6875rem;line-height:1.5;color:#4b5563;white-space:pre-wrap;word-break:break-all;overflow-wrap:break-word"></pre>
    <button type="button" onclick="location.reload()"
            style="border:0;border-radius:.5rem;background:#1f4d3a;color:#fff;padding:.625rem 1.25rem;font-size:.9375rem;cursor:pointer">
      重新載入
    </button>
  </div>

  <script>
    (function () {
      var RELOAD_FLAG = '__jabez_boot_reloaded__';
      var BOOT_TIMEOUT_MS = 10000;
      var SHOW_GRACE_MS = 2500;
      var shown = false;
      var firstError = '';

      /*
        瀏覽器能力探測（**畫面上唯一能分辨「版本太舊」與「其他錯誤」的依據**）。
        本站的產出物實測需要 Safari / iOS **16.4** 以上：
          · main.js 用到 class static initialization block（`static{...}`，Safari 16.4+）
            —— 舊版是 **parse 期就 SyntaxError**，整支 main.js 一行都不會執行
          · styles.css（Tailwind v4）用到 @property（同為 Safari 16.4+）
        探測刻意用 `new Function`（而非直接寫 `class T{static{}}`），
        否則這段 inline script 自己就會在舊瀏覽器 parse 失敗，連保底畫面都出不來。

        ⚠ 探測條件與 build target 綁定：日後若在 `Admin/.browserslistrc` 降低目標版本
        （esbuild 會把 `static{...}` 降級），這裡必須跟著放寬，否則會把「明明跑得動」的
        使用者誤擋在門外。見 docs/frontend-design.md §15.7。
      */
      function supportsModernJs() {
        try { new Function('class T{static{}}'); return true; } catch (e) { return false; }
      }
      function supportsModernCss() {
        try { return !!(window.CSS && CSS.supports && CSS.supports('color', 'oklch(0 0 0)')); }
        catch (e) { return false; }
      }

      /* sessionStorage 在「阻擋所有 Cookie」時連讀取都會丟 SecurityError，故一律包 try */
      function flagRead() { try { return sessionStorage.getItem(RELOAD_FLAG); } catch (e) { return null; } }
      function flagWrite() { try { sessionStorage.setItem(RELOAD_FLAG, '1'); return true; } catch (e) { return false; } }
      function flagClear() { try { sessionStorage.removeItem(RELOAD_FLAG); } catch (e) {} }

      /*
        判斷「真的有畫出東西」不能只看 app-root 有沒有子元素。
        實測（2026-09）：AuthService 建構失敗時 Angular 仍會 render 出
        `<app-root><router-outlet></router-outlet><!----></app-root>` ——
        子元素存在、但高度 0、一個字都沒有，正是使用者看到的純白畫面。
        故改以「量得到高度或有文字」為準。
      */
      function booted() {
        var root = document.querySelector('app-root');
        if (!root) return false;
        return root.offsetHeight > 0 || (root.innerText || '').trim().length > 0;
      }

      /*
        刻意延遲再確認一次才顯示：早期的非致命錯誤（某支 API 失敗、第三方資源被擋）
        不該讓一個正在正常啟動的畫面跳出「載入失敗」。只有等到寬限期過後仍沒 render 才算真的死掉。
      */
      function show(msg) {
        if (shown || booted()) return;
        setTimeout(function () {
          if (shown || booted()) return;
          shown = true;
          document.getElementById('boot-fallback-msg').textContent = msg;
          document.getElementById('boot-fallback-diag').textContent =
            'UA: ' + navigator.userAgent +
            '\nJS: ' + (supportsModernJs() ? 'ok' : 'too old') +
            ' / CSS: ' + (supportsModernCss() ? 'ok' : 'too old') +
            '\nERR: ' + (firstError || '(none)');
          document.getElementById('boot-fallback').style.display = 'block';
        }, SHOW_GRACE_MS);
      }

      /*
        部署當下開頁可能拿到新的 index.html 卻抓到舊的 chunk（或反過來），舊檔已不存在 → 純白。
        這種情況重載一次就會好，故自動重載一次；用 flag 確保只重載一次，避免無窮迴圈。
      */
      function isChunkError(msg) {
        return /dynamically imported module|Importing a module script failed|error loading dynamically imported|ChunkLoadError/i.test(msg || '');
      }

      function handle(msg) {
        if (!firstError && msg) firstError = String(msg).slice(0, 300);
        if (booted()) return;
        if (isChunkError(msg) && !flagRead() && flagWrite()) {
          location.reload();
          return;
        }
        show('請重新載入頁面再試一次。');
      }

      /*
        版本太舊時**不要等 timeout、也不要印「請重新載入」**：重載一百次也不會好，
        使用者只會反覆重試而不知道該更新系統。直接點名 iOS 16.4 才是可行的自救路徑。
      */
      if (!supportsModernJs() || !supportsModernCss()) {
        show('您的瀏覽器版本過舊，無法執行本系統。');
        document.getElementById('boot-fallback-hint').innerHTML =
          'iPhone / iPad：設定 → 一般 → 軟體更新，更新至 <b>iOS 16.4 以上</b>後再開啟。<br>' +
          '若機型已無法再更新，請改用電腦或較新的手機操作。<br>' +
          '（重新載入無法解決此問題）';
      }

      window.addEventListener('error', function (e) {
        handle((e && e.message) || (e && e.error && e.error.message) || '');
      }, true);

      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        handle((r && r.message) || String(r || ''));
      });

      /* 沒丟例外但就是沒 render（例如 chunk 請求被中斷而永遠 pending）也要有出口 */
      setTimeout(function () {
        if (!booted()) show('載入時間過長，可能是網路不穩或瀏覽器不支援。');
      }, BOOT_TIMEOUT_MS);

      /* 成功啟動就把重載旗標清掉，下次部署才能再自動重載一次 */
      window.addEventListener('load', function () {
        setTimeout(function () { if (booted()) flagClear(); }, 0);
      });
    })();
  </script>
</body>
</html>
