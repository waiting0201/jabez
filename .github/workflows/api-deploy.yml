name: Deploy Api (Azure Functions)

on:
  push:
    branches: [staging, master]
    paths:
      - 'Api/**'
      - '.github/workflows/api-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Api
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Publish
        run: dotnet publish Api/Api.csproj -c Release -o ./output
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ github.ref == 'refs/heads/master' && 'jabez-api' || 'jabez-api-staging' }}
          package: ./output
          publish-profile: ${{ github.ref == 'refs/heads/master' && secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_PROD || secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_STAGING }}
