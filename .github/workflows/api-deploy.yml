name: Deploy Api (Azure Functions)

on:
  push:
    branches: [staging, master]
    paths:
      - 'Api/**'
      - '.github/workflows/api-deploy.yml'

permissions:
  id-token: write   # OIDC 取得 federated token 用
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Api
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish Api/Api.csproj -c Release -o ./output
      # Flex Consumption 不支援 publish profile；用 OIDC 聯合身分登入（免長期密鑰）
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ github.ref == 'refs/heads/master' && 'jabez-api' || 'jabez-api-staging' }}
          package: ./output
